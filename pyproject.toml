[project]
name = "omeka-tools"
version = "0.1.0"
description = "Python client to query Omeka API"
authors = [
    {name = "dante.am",email = "dante.avino@alum.esci.upf.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "dateparser>=1.2",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "qdrant-client>=1.9",
    "sentence-transformers>=2.7",
    "pdfkit>=1.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
